<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园失物招领</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-title">校园<span>失物招领</span></div>

  <div class="phone">
    <div class="status-bar"><span id="clock">9:41</span><span>📶 📶 🔋</span></div>

    <!-- 导航栏 -->
    <div class="nav-bar">
      <span class="back" id="navBack" style="display:none;">‹</span>
      <span id="navTitle">校园失物招领</span>
      <span class="nav-right" id="navRight" style="display:none;"></span>
    </div>

    <!-- 内容区 -->
    <div class="content" id="content">

      <!-- 首页 -->
      <div class="page active" id="page-home">
        <div class="search-bar">
          <input class="search-input" id="homeSearch" placeholder="搜索物品名称，如“校园卡”">
          <span class="search-do" id="homeSearchDo">搜索</span>
        </div>
        <div class="tabs" id="typeTabs">
          <div class="tab active" data-type="all">全部</div>
          <div class="tab" data-type="lost">寻物</div>
          <div class="tab" data-type="found">招领</div>
        </div>
        <div class="filter-bar" id="categoryChips"></div>
        <div id="homeList"></div>
      </div>

      <!-- 发布页 -->
      <div class="page" id="page-publish">
        <div class="type-selector" id="typeSelector">
          <div class="type-btn selected" data-type="lost">🔍 发布寻物</div>
          <div class="type-btn" data-type="found">📦 发布招领</div>
        </div>

        <div class="form-section">
          <div class="form-row">
            <span class="form-label required">物品名称</span>
            <input class="form-input" id="f-title" placeholder="如：校园卡、雨伞">
          </div>
          <div class="form-row">
            <span class="form-label required">地点</span>
            <input class="form-input" id="f-location" placeholder="如：第二食堂、图书馆三楼">
          </div>
          <div class="form-row">
            <span class="form-label required">时间</span>
            <input class="form-input" id="f-time" type="datetime-local">
          </div>
          <div class="form-row">
            <span class="form-label">分类</span>
            <select class="form-input form-select" id="f-category">
              <option value="证件卡片">证件卡片</option>
              <option value="电子产品">电子产品</option>
              <option value="钥匙">钥匙</option>
              <option value="雨具">雨具</option>
              <option value="书籍文具">书籍文具</option>
              <option value="生活用品">生活用品</option>
              <option value="其他">其他</option>
            </select>
          </div>
        </div>

        <div class="form-section">
          <div class="form-row top">
            <span class="form-label">详细描述</span>
            <textarea class="form-textarea" id="f-desc" placeholder="请描述物品的颜色、品牌、特征等信息，方便匹配…"></textarea>
          </div>
        </div>

        <div class="form-section">
          <div class="form-row">
            <span class="form-label required">联系方式</span>
            <input class="form-input" id="f-contact" placeholder="微信号 / 手机号 / QQ">
          </div>
          <div class="form-row">
            <span class="form-label">联系类型</span>
            <select class="form-input form-select" id="f-contactType">
              <option value="微信">微信</option>
              <option value="手机">手机</option>
              <option value="QQ">QQ</option>
              <option value="邮箱">邮箱</option>
            </select>
          </div>
        </div>

        <div class="field-error" id="formError" style="display:none;"></div>
        <button class="submit-btn" id="submitBtn">发 布</button>
        <div class="form-tip">发布即表示同意《用户协议》，信息仅保存在本地浏览器</div>
      </div>

      <!-- 详情页 -->
      <div class="page" id="page-detail">
        <div id="detailBody"></div>
      </div>

      <!-- 我的发布 -->
      <div class="page" id="page-mine">
        <div class="my-header">
          <div class="my-name">同学 👋</div>
          <div class="my-stats" id="myStats"></div>
        </div>
        <div class="section-title">我的发布</div>
        <div id="mineList"></div>
        <div class="section-title">其他功能</div>
        <div class="form-section">
          <div class="form-row"><span class="form-label" id="resetData" style="cursor:pointer;color:#ff4d4f;">🗑 清空本地数据</span><span style="color:#ccc;font-size:14px;">›</span></div>
          <div class="form-row"><span class="form-label">ℹ️ 关于</span><span style="color:#ccc;font-size:14px;">校园失物招领 v1.0</span></div>
        </div>
      </div>

    </div>

    <!-- 底部导航 -->
    <div class="tab-bar" id="tabBar">
      <div class="tab-item active" data-go="home"><span class="tab-icon">🏠</span>首页</div>
      <div class="tab-item" data-go="publish"><span class="tab-publish">＋</span></div>
      <div class="tab-item" data-go="mine"><span class="tab-icon">👤</span>我的</div>
    </div>

    <!-- 详情页底部联系栏（仅详情页显示） -->
    <div class="contact-bar" id="contactBar" style="display:none;">
      <div class="contact-info" id="contactInfo"></div>
      <button class="contact-btn secondary" id="copyContact">复制</button>
      <button class="contact-btn" id="contactBtn">联系发布者</button>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
